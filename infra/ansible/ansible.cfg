[defaults]
# Inventory & roles
inventory       = inventory/dev/hosts.yml
roles_path      = roles
collections_path = collections

# Output & UX
stdout_callback = yaml
callback_whitelist = profile_tasks, timer
display_skipped_hosts = false
nocows          = true

# Safety
host_key_checking = False        # Bastion-brokered dynamic IPs; use with caution, ideally scope known_hosts instead
retry_files_enabled = False
deprecation_warnings = True

# Performance
forks           = 10
pipelining      = True
gathering       = smart
fact_caching    = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout = 86400

# Logging (audit trail — important for config-change traceability)
log_path        = /var/log/ansible/ansible.log

[privilege_escalation]
become          = True
become_method   = sudo
become_user     = root
become_ask_pass = False

[ssh_connection]
ssh_args        = -o ControlMaster=auto -o ControlPersist=60s -o ProxyCommand="az network bastion tunnel --name bastion-host --resource-group rg-nodeapp-prod --target-resource-id %h --port 2222 && ssh -p 2222 azureuser@localhost"
control_path_dir = /tmp/.ansible-cp
pipelining      = True
